<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>纸间阅读器</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:14px system-ui,sans-serif;background:#f8f7f3;color:#28332b}body{display:flex;flex-direction:column;min-height:480px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #dedfd7}button,a{font:inherit;color:#34523c}button{border:1px solid #bbc5b8;border-radius:6px;padding:6px 10px;background:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{margin:0;padding:7px 14px;color:#5f675e;font-size:12px}iframe{flex:1;width:100%;min-height:420px;border:0}strong{margin-right:auto}
  </style>
</head>
<body>
  <header><strong>纸间</strong><button id="share" disabled>读取已共享选区</button><a id="external" target="_blank" rel="noopener noreferrer">在浏览器打开</a></header>
  <p id="status" role="status">正在连接原生面板。也可在浏览器继续阅读。</p>
  <iframe id="reader" title="纸间 PDF 阅读器" referrerpolicy="origin" allow="clipboard-write"></iframe>
  <script>
    'use strict';
    const config = __PAPERDESK_CONFIG__;
    const baseOrigin = new URL(config.baseUrl).origin;
    const frame = document.getElementById('reader');
    const status = document.getElementById('status');
    const external = document.getElementById('external');
    const share = document.getElementById('share');
    const sessionId = crypto.randomUUID();
    const readerMessagesAllowed = /^https?:$/.test(location.protocol) && location.origin !== 'null';
    let nextId = 1, hostOrigin, capabilities = {}, contextVersion = 0, published = false;
    let injectionQueue = Promise.resolve(), injectionPending = false, lastShareId;
    const pending = new Map();
    try { const candidate = new URL(document.referrer).origin; if (candidate !== 'null') hostOrigin = candidate; } catch {}
    function send(message) { window.parent.postMessage(message, hostOrigin || '*'); }
    function request(method, params) {
      return new Promise((resolve, reject) => {
        const id = nextId++;
        const timer = setTimeout(() => { pending.delete(id); reject(new Error('宿主没有响应，请使用浏览器或普通工具继续。')); }, 15000);
        pending.set(id, { resolve, reject, timer });
        send({ jsonrpc: '2.0', id, method, params });
      });
    }
    function navigate(value) {
      let url;
      try { url = new URL(value); } catch { return; }
      if (url.origin !== baseOrigin || url.pathname !== '/' || url.username || url.password) return;
      external.href = url.href;
      url.searchParams.set('readerSession', sessionId);
      url.searchParams.set('embedded', '1');
      // Without a trustworthy parent origin, the reader cannot notify us of
      // cancellation. Keep model-context injection disabled in that sandbox.
      if (readerMessagesAllowed) url.searchParams.set('parentOrigin', location.origin);
      frame.src = url.href;
    }
    function injectContext(payload, version) {
      if (!readerMessagesAllowed) return Promise.reject(new Error('当前面板来源不支持可靠撤回，请在对话中使用普通工具读取共享选区。'));
      injectionPending = true;
      const task = injectionQueue.then(async () => {
        if (version !== contextVersion) return;
        await request('ui/update-model-context', payload);
        published = Boolean(payload.content?.length || payload.structuredContent);
      });
      injectionQueue = task.catch(() => {});
      return task.finally(() => { if (version === contextVersion) injectionPending = false; });
    }
    async function updateContext(version) {
      if (!readerMessagesAllowed) throw new Error('当前面板来源不支持可靠撤回，请在对话中使用普通工具读取共享选区。');
      if (!capabilities.serverTools) throw new Error('当前宿主不支持面板调用工具，请在对话中请求读取共享选区。');
      const result = await request('tools/call', { name: 'paperdesk_get_context', arguments: { sessionId } });
      if (version !== contextVersion) return;
      if (result.isError) throw new Error(result.structuredContent?.error || '请在纸间打开文献并共享选区后重试。');
      const modalities = capabilities.updateModelContext;
      if (!modalities) throw new Error('当前宿主不支持上下文注入，请在对话中调用读取共享选区。');
      const content = (result.content || []).filter(block => (block.type === 'text' && modalities.text) || (block.type === 'image' && modalities.image));
      const payload = { content };
      if (modalities.structuredContent) payload.structuredContent = result.structuredContent;
      if (!content.length && !payload.structuredContent) throw new Error('当前宿主不支持共享内容的文字或图片格式。');
      await injectContext(payload, version);
      if (version !== contextVersion) return;
      status.textContent = result.content?.some(block => block.type === 'image') && !modalities.image
        ? '已共享文字和区域坐标；此宿主未声明图片上下文支持。'
        : '已将用户共享的选区交给当前对话。新对话消息可使用这段上下文。';
    }
    async function clearContext() {
      contextVersion++;
      if ((published || injectionPending) && capabilities.updateModelContext) {
        await injectContext({ content: [] }, contextVersion);
      }
    }
    window.addEventListener('message', event => {
      if (event.source === frame.contentWindow && event.origin === baseOrigin) {
        if (!readerMessagesAllowed) return;
        const message = event.data;
        if (message?.type !== 'paperdesk-context' || message.context?.sessionId !== sessionId) return;
        const context = message.context;
        if (context.sharedSelection === true) {
          // Older readers without a share token use the explicit refresh
          // button. Never turn a heartbeat into repeated model tool calls.
          if (typeof context.shareId !== 'string' || context.shareId === lastShareId) return;
          lastShareId = context.shareId;
          const version = ++contextVersion;
          updateContext(version).catch(error => { status.textContent = error.message; });
        } else if (lastShareId !== null) {
          lastShareId = null;
          clearContext().catch(error => { status.textContent = error.message; });
        }
        return;
      }
      if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
      if (hostOrigin && event.origin !== hostOrigin) return;
      if (!hostOrigin && event.origin !== 'null') hostOrigin = event.origin;
      const message = event.data;
      if (Object.hasOwn(message, 'id') && pending.has(message.id)) {
        const task = pending.get(message.id); pending.delete(message.id); clearTimeout(task.timer);
        if (message.error) task.reject(new Error(message.error.message || '宿主请求失败。'));
        else task.resolve(message.result);
      } else if (message.method === 'ui/notifications/tool-result') {
        const url = message.params?.structuredContent?.url;
        if (url) navigate(url);
      } else if (message.method === 'ping' || message.method === 'ui/resource-teardown') {
        if (message.method === 'ui/resource-teardown') { contextVersion++; frame.src = 'about:blank'; }
        send({ jsonrpc: '2.0', id: message.id, result: {} });
      }
    });
    share.addEventListener('click', () => {
      const version = ++contextVersion;
      updateContext(version).catch(error => { status.textContent = error.message; });
    });
    navigate(config.baseUrl);
    request('ui/initialize', { appInfo: { name: 'paperdesk-reader', version: '0.1.0' }, appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] }, protocolVersion: '2026-01-26' })
      .then(result => {
        capabilities = result.hostCapabilities || {};
        send({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} });
        share.disabled = !readerMessagesAllowed || !capabilities.serverTools;
        status.textContent = readerMessagesAllowed
          ? '在阅读器选择文字或区域，再点“交给 Codex”。只有主动共享的选区会交给对话。'
          : '当前面板来源无法可靠接收撤回通知，已停用上下文注入。请在对话中使用普通工具读取已共享选区。';
      }).catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>
