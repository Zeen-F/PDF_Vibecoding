name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure reliable Ubuntu apt mirrors
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/99-paperdesk-network >/dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  # Keep the existing protected-branch status name. A cancelled, failed, or
  # skipped platform must never allow this aggregate gate to pass.
  check:
    needs: platform-check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platform checks
        env:
          PLATFORM_RESULT: ${{ needs.platform-check.result }}
        run: test "$PLATFORM_RESULT" = success
