name: Desktop preview release

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a tagged draft after verification (main only)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
            arch: arm64
          - os: windows-latest
            platform: win-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PAPERDESK_VERIFICATION_ROOT: .local/release-verification/current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify release version and runner architecture
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Unexpected runner architecture.');
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid release version.');
          if (process.env.RELEASE_REF.startsWith('refs/tags/') && process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('The release tag must match package.json.');
          }
          if (!readFileSync(`docs/history/${version}.md`, 'utf8').trim()) throw new Error('Missing release notes.');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:desktop
      - name: Test source Obsidian vault and bookmarks
        run: PAPERDESK_ACCEPTANCE_DIR="$PAPERDESK_VERIFICATION_ROOT/source-vault" node scripts/test-vault-desktop.mjs
      - name: Test source desktop reliability
        run: PAPERDESK_ACCEPTANCE_DIR="$PAPERDESK_VERIFICATION_ROOT/source" npm run test:desktop:reliability
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npm run desktop:dist
      - name: Build Windows ZIP
        if: runner.os == 'Windows'
        run: npm run desktop:dist:win:zip
      - name: Install the macOS DMG into an isolated directory
        if: runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mount="$RUNNER_TEMP/paperdesk-release-mount"
          installed="$RUNNER_TEMP/paperdesk-release-installed"
          mkdir "$mount" "$installed"
          hdiutil attach "release/Paperdesk-${RELEASE_VERSION}-mac-arm64.dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Paperdesk.app" "$installed/Paperdesk.app"
          echo "PAPERDESK_RELEASE_APP=$installed/Paperdesk.app" >> "$GITHUB_ENV"
      - name: Extract the Windows ZIP into an isolated directory
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'paperdesk-release-installed'
          if (Test-Path -LiteralPath $destination) { throw 'Release test destination already exists' }
          Expand-Archive -LiteralPath "release/Paperdesk-$env:RELEASE_VERSION-win-x64.zip" -DestinationPath $destination
          $application = Join-Path $destination 'Paperdesk.exe'
          if (-not (Test-Path -LiteralPath $application)) { throw 'Windows ZIP has no Paperdesk.exe at its root' }
          "PAPERDESK_RELEASE_APP=$application" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test the actual installed release and reject private files
        run: npm run test:desktop -- --packaged "$PAPERDESK_RELEASE_APP"
      - name: Test installed Obsidian vault and bookmarks
        run: PAPERDESK_ACCEPTANCE_DIR="$PAPERDESK_VERIFICATION_ROOT/packaged-vault" node scripts/test-vault-desktop.mjs --packaged "$PAPERDESK_RELEASE_APP"
      - name: Test installed desktop reliability
        run: PAPERDESK_ACCEPTANCE_DIR="$PAPERDESK_VERIFICATION_ROOT/packaged" npm run test:desktop:reliability -- --packaged "$PAPERDESK_RELEASE_APP"
      - name: Build and verify browser archive
        if: runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run browser:dist
          node scripts/test-browser-release.mjs --archive "release/Paperdesk-${RELEASE_VERSION}-browser.zip"
      - name: Generate macOS checksums
        if: runner.os == 'macOS'
        run: npm run release:checksums
      - name: Generate Windows ZIP checksum
        if: runner.os == 'Windows'
        run: npm run release:checksums -- --platform win32 --windows-format zip
      - name: Prepare compact verification evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const root = path.resolve(process.env.PAPERDESK_VERIFICATION_ROOT);
          const evidence = path.join(root, 'evidence');
          await mkdir(evidence, { recursive: true });
          // Only outcome fields leave the runner; no profiles, PDFs or screenshots.
          async function result(filename, kind) {
            try {
              const data = JSON.parse(await readFile(filename, 'utf8'));
              return { kind, status: data.status,
                groups: data.groups?.map(({ name, status, durationMs }) => ({ name, status, durationMs })),
                checkCount: data.checks?.length, rendererErrorCount: data.rendererErrors?.length || 0,
                automationErrorCount: data.automationErrors?.length || 0, cleanup: data.cleanup };
            } catch (error) { return { kind, status: error.code === 'ENOENT' ? 'not-run' : 'unreadable-evidence' }; }
          }
          const summaries = [];
          for (const kind of ['source', 'packaged']) {
            summaries.push(await result(path.join(root, kind, 'results.json'), `${kind}-reliability`));
            summaries.push(await result(path.join(root, `${kind}-vault`, `${kind}-summary.json`), `${kind}-vault`));
          }
          if (process.platform === 'darwin') summaries.push(await result('.local/verification/browser-release/latest.json', 'browser-archive'));
          await writeFile(path.join(evidence, 'verification-summary.json'), JSON.stringify({
            workflowStatus: process.env.JOB_STATUS, platform: process.platform, runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, summaries,
          }, null, 2) + '\n');
          if (process.env.JOB_STATUS === 'success' && summaries.some(item => item.status !== 'passed' ||
              (item.kind === 'browser-archive' && item.cleanup !== true))) throw new Error('Release verification evidence is incomplete.');
          NODE
      - name: Save compact verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Paperdesk-verification-${{ matrix.platform }}
          path: ${{ env.PAPERDESK_VERIFICATION_ROOT }}/evidence/verification-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Save verified installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Paperdesk-installers-${{ matrix.platform }}
          path: |
            release/Paperdesk-${{ steps.version.outputs.version }}-${{ matrix.platform }}.*
            release/Paperdesk-${{ steps.version.outputs.version }}-browser.zip
            release/SHA256SUMS*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Clean installed test copy
        if: always()
        shell: pwsh
        run: |
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          foreach ($name in @('paperdesk-release-installed', 'paperdesk-release-mount')) {
            $target = [IO.Path]::GetFullPath((Join-Path $root $name))
            if ([IO.Path]::GetDirectoryName($target) -ne $root) { throw 'Unexpected cleanup target' }
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          }

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && inputs.create_draft)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Paperdesk-installers-*
          path: release
          merge-multiple: true
      - name: Verify downloaded artifacts
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          sha256sum --check SHA256SUMS-win
          sha256sum --check SHA256SUMS-browser
      - name: Create draft prerelease after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          gh release create "$tag" \
            "release/Paperdesk-${version}-mac-arm64.dmg" \
            "release/Paperdesk-${version}-mac-arm64.zip" \
            "release/Paperdesk-${version}-win-x64.zip" \
            "release/Paperdesk-${version}-browser.zip" \
            release/SHA256SUMS release/SHA256SUMS-win release/SHA256SUMS-browser LICENSE \
            --verify-tag --draft --prerelease \
            --title "Paperdesk ${version}" --notes-file "docs/history/${version}.md"
